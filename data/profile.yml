# ── Narrative ───────────────────────────────────────────────────────────────
# Prose, deliberately. These answer the "what is he like to work with" questions
# that structured fields cannot.

narrative:
  adaptability: >-
    Domingo has lived independently since he was eighteen, studying and working
    away from his family environment across several cities and countries: Almería,
    Seville, Bratislava on an Erasmus programme, Berlin on an international
    internship, and now Madrid. Moving continuously through different cultural and
    professional contexts has built autonomy, maturity and the ability to
    integrate quickly into a new team — reading its internal dynamics, adjusting
    to different leadership styles, and contributing from a collaborative
    position. He does not merely tolerate change; he has a demonstrated habit of
    turning uncertainty into learning.

  resilience: >-
    His career change into data science was built through sustained effort
    rather than a lucky break. Coming from marketing, international sales and
    logistics, he acquired complex technical competencies from scratch — a
    demanding master's, a run of technical certifications, and practical projects
    in statistics, machine learning and deep learning — and started his first
    data projects on his own initiative while still in a sales job. He keeps a
    pragmatic, results-oriented approach and changes direction when he sees a
    real opportunity for impact, not out of inertia.

  teamwork: >-
    Teamwork is central to how he operates. His master's thesis was built by a
    team of six in collaboration with TUI, and he contributed both to the
    analytical work and to framing its business impact — coordinating effort,
    aligning objectives, explaining complex ideas and building consensus. The
    result earned the top grade and third place in the scholarship competition.
    At My English School, the team he was part of generated more than half of
    the school's revenue in its first 11 months.

  career_change: >-
    What makes the profile unusual is that the business years were not wasted
    time. Having sold, priced, negotiated and reported to stakeholders, he knows
    what decision sits behind each request for data and can explain the result
    to people who will never read the code. That is also why, at Data Equity, he
    trains company teams in applied AI. He combines statistical rigour with
    commercial judgement, which lets him design sound analyses and validate
    models with judgement instead of producing exploratory work with no bearing
    on a decision.

  approach: >-
    He describes his work as problem, diagnosis, solution. Raw data that arrives
    from several sources in formats that do not match: first find what is broken
    — duplicates, gaps, formats — then clean and adapt it and leave a pipeline
    that does it on its own next time. Manual work nobody thought to automate:
    if it repeats and follows rules it is a data problem, even if nobody calls it
    that, so automate it and give the time back to the team. Data that never
    reaches whoever decides: the chart is rarely what fails, the business
    question behind it is, so build dashboards for a specific decision and keep
    them current. "It works on my laptop": a notebook that ran once is not a
    system until it has scheduled runs, incremental updates and deployment, so
    he builds pipelines that run themselves and deploys models to the cloud.
    Models that shine in the demo: with little signal, extrapolating is science
    fiction and intuition does not replace measuring, so he compares
    alternatives on real data and keeps the one that wins, even when it is not
    the flashiest.
