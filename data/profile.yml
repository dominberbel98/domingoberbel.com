  - id: laliga-dashboard
    name: La Liga live dashboard and predictive model
    year: 2026
    summary: >-
      A live football analytics section of the portfolio: a PySpark pipeline that
      pulls La Liga standings on a schedule, and a predictive model projecting
      how the season ends.
    problem: >-
      Demonstrating a data pipeline needs something that actually moves. A static
      dataset cannot show scheduling, incremental updates, or how a model behaves
      when the data underneath it changes.
    approach: >-
      A PySpark transformation over the SportsRC API computing zone
      classification, win/draw/loss rates and a deterministic league ranking on
      the official tiebreak, orchestrated by GitHub Actions on a 30-minute cron
      that commits the output and redeploys the frontend. On top of it, an
      end-of-season projection combining a pace model, a Poisson Monte Carlo
      simulation over the remaining fixtures, and an XGBoost classifier for zone
      probabilities. Visualised with Recharts.
    outcome: >-
      Runs unattended and updates the live site every 30 minutes. The season
      rollover exposed a real lesson worth keeping: at matchday one there is not
      enough signal to extrapolate, so the projection shrinks toward a prior
      rather than multiplying a single result by 38.
    stack:
      - Python
      - PySpark
      - Apache Spark
      - XGBoost
      - Monte Carlo simulation
      - GitHub Actions
      - React
      - Recharts
    repo: https://github.com/dominberbel98/domingoberbel.com
    live_url: https://domingoberbel.com

  - id: credit-scoring
    name: Credit scoring model
    year: 2026
    summary: >-
      An interactive credit scoring model on the portfolio, with the full
      evaluation surface exposed rather than just a score.
    problem: >-
      A scoring model is only trustworthy if you can see how it discriminates and
      what drives it. Most demos show a number and hide the evidence.
    approach: >-
      Binary default/no-default classification over a calibrated synthetic
      dataset of 5,000 applicants at roughly a 17% default rate. Features cover
      income, employment history, on-time payment history, credit utilisation,
      credit age, number of accounts, recent enquiries, derogatory marks,
      loan-to-income, loan purpose and home ownership, preprocessed through a
      ColumnTransformer with StandardScaler and OneHotEncoder. Two models are
      trained side by side: logistic regression for interpretability and gradient
      boosting for capacity, the latter calibrated with Platt scaling so the
      probabilities mean something rather than only ranking correctly. Validation
      is a stratified 75/25 split plus 5-fold stratified cross-validation, scored
      on a held-out test set with AUC-ROC, GINI, the KS statistic, average
      precision, F1 and the Brier score. Results are turned into a FICO-style PDO
      scorecard on the 300-850 range with Poor to Exceptional bands, and driver
      attribution uses model-agnostic permutation importance. For the live demo
      the logistic coefficients and scaler parameters are exported to JSON and the
      sigmoid is evaluated in the browser, so moving a slider recomputes the score
      with no network round trip and no backend cost.
    outcome: >-
      Live on the site as an explorable model rather than a static chart, with its
      discrimination, its calibration and its drivers all on screen.
    stack:
      - Python
      - scikit-learn
      - pandas
      - NumPy
      - React
      - Recharts
    repo: https://github.com/dominberbel98/domingoberbel.com
    live_url: https://domingoberbel.com

  - id: product-recommender
    name: Product recommendation engine
    year: 2026
    summary: >-
      A content-based product recommender on the portfolio, with demo personas
      and a visible similarity ranking.
    problem: >-
      Recommenders are usually presented as a black box. The interesting part is
      why a given item ranked where it did.
    approach: >-
      Content-based recommendation over a catalogue of 32 products across four
      categories. Each product is vectorised by combining TF-IDF over its
      description (1-2 grams, 120 features, English stop-words) with a one-hot
      category encoding and MinMax-scaled price and rating. A user profile is the
      mean of the vectors of the products they picked, and the score is cosine
      similarity against every product. The top-N is then re-ranked with Maximal
      Marginal Relevance at lambda 0.7, so the list balances relevance against
      diversity instead of returning six near-identical items. Quality is measured
      with intra-list diversity and catalogue coverage across four demo personas.
      As with the scoring model, inference runs client-side: the feature matrix,
      TF-IDF vocabulary and catalogue metadata are exported to JSON and the
      similarity, mean vector and MMR re-ranking are implemented in the browser.
      That also makes it explainable — selecting a recommendation decomposes the
      similarity into the TF-IDF terms, category and price/rating contributions
      that produced it.
    outcome: >-
      Live on the site, with the ranking, its similarity scores and the terms
      responsible for each recommendation all visible.
    stack:
      - Python
      - scikit-learn
      - NumPy
      - TF-IDF
      - React
      - Recharts
    repo: https://github.com/dominberbel98/domingoberbel.com
    live_url: https://domingoberbel.com

