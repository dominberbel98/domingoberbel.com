    outcome: >-
      Top grade for the master's thesis and third place in the scholarship
      competition of the Master's in Data Science, Big Data & Business
      Analytics, judged on methodology, results, presentation and innovation.
      Applicable to strategic decision-making and to improving the customer
      experience in tourism.
    stack:
