# ── Projects ────────────────────────────────────────────────────────────────

projects:
  - id: portfolio-chatbot
    name: Portfolio RAG assistant
    year: 2026
    summary: >-
      This site, and the assistant answering in it. A web portfolio designed to
      present a professional profile in a clearer, more useful and interactive
      way than a static CV can.
    problem: >-
      A static CV forces every reader down the same path, when a recruiter, a
      hiring manager and an engineer each want to know something different.
      Information should adapt to whoever is asking.
    approach: >-
      A retrieval-augmented assistant over a structured profile. The knowledge
      base is a single validated YAML file generated into one document per entity
      — role, project, degree, certification — embedded with Google's
      gemini-embedding-2 using the asymmetric query and document task types.
      Retrieval is hybrid: dense cosine similarity combined with BM25 keyword
      scores, each min-max normalised and then weighted, with the lexical half
      deliberately kept light. That choice was measured rather than assumed —
      Reciprocal Rank Fusion was tried first and scored worse on a golden set of
      real questions taken from the site's own logs, because discarding score
      magnitude let a weak keyword match displace a confident semantic one.
      Generation runs on the OpenAI Responses API with light reasoning. The
      model is given search tools rather than a fixed context, so it can search
      again when the first pass is thin; the visitor's question is searched
      before the first model call, which saves a full round trip. Answers stream
      over Server-Sent Events sentence by sentence, and each sentence passes a
      groundedness check against the profile vocabulary before it is sent, so
      the assistant cannot attribute a technology he has never used. It answers
      in the language the question is asked in. React, Vite and Tailwind CSS on
      the frontend with a CRT/retro theme; Python 3.11 with FastAPI, Pydantic
      and Uvicorn on the backend. Cloudflare Turnstile for CAPTCHA, per-IP rate
      limiting, a daily token budget, pre-LLM content guardrails, Nginx serving
      security headers (CSP, HSTS, X-Frame-Options), and SQLite-backed question
      analytics with protected admin endpoints. Deployed as a Docker container
      on Azure Container Apps behind a custom domain, with the frontend on Azure
      Static Web Apps and the API keys held as Container Apps secrets rather than
      plain environment variables.
    outcome: >-
      Live and serving real traffic at domingoberbel.com. It demonstrates the
      whole path from architecture to production rather than a notebook: the
      same person chose the retrieval strategy, wrote the guardrails, and owns
      the deployment.
    stack:
      - Python
      - FastAPI
      - Pydantic
      - Uvicorn
      - React
      - Vite
      - Tailwind CSS
      - Server-Sent Events
      - Docker
      - Azure
      - Azure Container Apps
      - Azure Static Web Apps
      - RAG
      - LLMs
      - OpenAI API
      - Google Gemini
      - embeddings
      - BM25
      - SQLite
      - Nginx
    repo: https://github.com/dominberbel98/domingoberbel.com
    live_url: https://domingoberbel.com

  - id: tfm-tourism-recommender
    name: Neural-network tourism recommender with RAG support (master's thesis with TUI)
    year: 2025
    summary: >-
      Master's thesis at Universidad Complutense de Madrid, built from July to
      September 2025 by a team of six in collaboration with TUI, which provided
      the data and the business context: a RAG system that answers tourism
      queries by combining historical, operational and predictive information,
      for personalised experiences.
    problem: >-
      Tourism decisions draw on historical metrics, day-to-day operational data
      and forecasts, which normally live in separate systems and cannot be asked
      a question in plain language.
    approach: >-
      Embeddings and a vector database for semantic search; queries against
      structured databases for historical metrics; a multi-output neural network
      that predicts hotel occupancy, revenue and customer satisfaction; and
      FastAPI orchestrating the sources, with answers generated in natural
